version: 2

project_name: neocloud

# dist 本身不支持 GoReleaser 模板；scripts/release-config.mjs 从布局渲染此占位符，调用方通过 --config 使用临时配置。
dist: "{{ .Env.GORELEASER_DIST }}"

builds:
  - id: application
    main: ./cmd/app
    binary: neocloud
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - >-
        -s -w
        -X main.buildVersion={{.Version}}
        -X main.buildCommit={{.Commit}}
        -X main.buildTime={{.Date}}
        -X main.buildDirty={{.IsGitDirty}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: node scripts/prepare-go-licenses.mjs --output "{{ .Env.GORELEASER_DIST }}/licenses/{{ .Os }}_{{ .Arch }}" --goos {{ .Os }} --goarch {{ .Arch }}

archives:
  - id: application
    ids:
      - application
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: docs/operations/backend-archive.md
        dst: README.md
      - LICENSE
      - NOTICE
      - config.example.yaml
      - api/openapi.yaml
      - locales/messages.zh-CN.yaml
      - internal/module/todo/binding/i18n/locales/messages.zh-CN.yaml
      - api/console-openapi.json
      - SOURCES.json
      - src: "{{ .Env.GORELEASER_DIST }}/licenses/{{ .Os }}_{{ .Arch }}/**"
        dst: third-party

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args:
      - "file:$artifact"
      - --output
      - "spdx-json=$document"
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false

snapshot:
  version_template: "{{ incpatch .Version }}-next.{{ .ShortCommit }}"

changelog:
  use: git
  abbrev: 7
  groups:
    - title: 功能
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: 修复
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: 其他维护
      order: 2

release:
  draft: true
  prerelease: auto
  header: |
    NeoCloud 文件与管理工作区，采用 Material Design 组件，提供响应式文件管理、PDF 与媒体阅读，以及悬浮、底部面板和全屏音乐播放器。

    NeoCloud 安装器识别 `neocloud` 命名的签名附件。更早发行版请保留原实例和备份，并为 NeoCloud 选择独立的安装目录和数据位置。

    Linux amd64 / arm64 可用 Docker 安装包，目标机需要 Docker、Compose 和 Cosign。下例只监听服务器本机，访问 http://127.0.0.1:4173/setup，使用 ~/neocloud/.control/setup-token 的令牌创建管理员。持久数据位于 ~/neocloud/data/。

    ```bash
    curl -fL --proto '=https' --proto-redir '=https' https://github.com/reina0721/neocloud/releases/latest/download/install.sh -o install.sh
    bash install.sh install --dir "$HOME/neocloud" --bind 127.0.0.1
    ~/neocloud/install.sh check-update
    ~/neocloud/install.sh upgrade
    ```

    支持启用同址网页运维，在 /maintenance 检查更新、完整备份、升级、回退和恢复。

    Windows amd64、Linux amd64 与 Linux arm64 可下载 `managed-full` 原生整包。Go 宿主同源提供内置静态页面和业务 API。独立后端使用 Go 归档或可在线换版的 `managed-go` 包。正式发布包受 SHA-256 清单与 GitHub OIDC Sigstore 签名保护。
    [原生整包使用说明](https://github.com/reina0721/neocloud/blob/main/docs/operations/backend-archive.md#运行原生-go-与-web-整包)
    [安装、升级与数据备份说明](https://github.com/reina0721/neocloud/blob/main/docs/operations/neocloud-deployment.md#release-下载版安装与升级)
