version: 2

project_name: clouddrive

# dist 本身不支持 GoReleaser 模板；scripts/release-config.mjs 从布局渲染此占位符，调用方通过 --config 使用临时配置。
dist: "{{ .Env.GORELEASER_DIST }}"

builds:
  - id: application
    main: ./cmd/app
    binary: clouddrive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - >-
        -s -w
        -X main.buildVersion={{.Version}}
        -X main.buildCommit={{.Commit}}
        -X main.buildTime={{.Date}}
        -X main.buildDirty={{.IsGitDirty}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: node scripts/prepare-go-licenses.mjs --output "{{ .Env.GORELEASER_DIST }}/licenses/{{ .Os }}_{{ .Arch }}" --goos {{ .Os }} --goarch {{ .Arch }}

archives:
  - id: application
    ids:
      - application
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: docs/operations/backend-archive.md
        dst: README.md
      - LICENSE
      - NOTICE
      - config.example.yaml
      - api/openapi.yaml
      - locales/messages.zh-CN.yaml
      - internal/module/todo/binding/i18n/locales/messages.zh-CN.yaml
      - api/console-openapi.json
      - SOURCES.json
      - src: "{{ .Env.GORELEASER_DIST }}/licenses/{{ .Os }}_{{ .Arch }}/**"
        dst: third-party

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args:
      - "file:$artifact"
      - --output
      - "spdx-json=$document"
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false

snapshot:
  version_template: "{{ incpatch .Version }}-next.{{ .ShortCommit }}"

changelog:
  use: git
  abbrev: 7
  groups:
    - title: 功能
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: 修复
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: 其他维护
      order: 2

release:
  draft: true
  prerelease: auto
  header: |
    CloudDrive 文件与管理工作区，采用 Material Design 组件，提供响应式文件管理、PDF 与媒体阅读，以及悬浮、底部面板和全屏音乐播放器。

    Linux amd64 / arm64 推荐使用离线 Docker 安装包。目标机无需编译源码或访问镜像仓库。下例只监听服务器本机，访问 http://127.0.0.1:4173/setup，使用 ~/clouddrive/.control/setup-token 的令牌创建管理员。持久数据位于 ~/clouddrive/data/。

    ```bash
    curl -fL --proto '=https' --proto-redir '=https' https://github.com/reina0721/neocloud/releases/latest/download/install.sh -o install.sh
    bash install.sh install --dir "$HOME/clouddrive" --bind 127.0.0.1
    ~/clouddrive/install.sh check-update
    ~/clouddrive/install.sh upgrade
    ```

    支持启用同址网页运维，在 /maintenance 检查更新、完整备份、升级、回退和恢复。已有实例应先按部署手册升级，再启用网页运维。

    Go 归档为独立后端。名称带 `managed-go` 的正式原生包另含能够换版的宿主程序，不包含 Web 服务。正式发布包均受 SHA-256 清单与 GitHub OIDC Sigstore 签名保护。
    [安装、升级与数据备份说明](https://github.com/reina0721/neocloud/blob/main/docs/operations/clouddrive-deployment.md#release-下载版安装与升级)
