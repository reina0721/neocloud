schema_version: 1
ownership: copy-owned
source:
  repository: github.com/reina0721/neocloud
  module: github.com/reina0721/neocloud
  application_name: neocloud
  application_description: 自托管文件管理与分享协作工作区
  binary_name: neocloud
  environment_prefix: NEOCLOUD_APP_
  config_filename: config.yaml
required_identity_changes:
  - id: module
    owners:
      - go.mod
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
  - id: application
    owners:
      - cmd/app/main.go
      - Dockerfile
      - .goreleaser.yaml
      - .github/workflows/*.yml
  - id: configuration
    owners:
      - cmd/app/main.go
      - .gitignore
      - config.example.yaml
      - README.md
  - id: provenance
    owners:
      - docs/scaffold-baseline.md
verification:
  forbidden_source_dependencies:
    - replace directive pointing to the source checkout
    - go.work or relative workspace dependency
    - Git remote inherited from the source repository
  required_commands:
    - go mod tidy -diff
    - go test ./...
    - go test -race ./...
    - go vet ./...
    - go build ./...
