name: clouddrive-ui-test

# Isolated production-mode acceptance environment; no developer database or storage mount.
x-backend: &backend
  image: clouddrive-api:kira
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  env_file:
    - .data/ui-production-control/backend.env
  environment:
    APP_LOGGER__ENVIRONMENT: production
    APP_LOGGER__LEVEL: info
    APP_AUTH__MODE: session
    APP_SCHEDULER__ENABLED: "true"
    APP_HTTP__ADDR: 0.0.0.0:8080
    APP_MANAGEMENT__ADDR: 0.0.0.0:9090
    APP_DATABASE__DRIVER: sqlite
    APP_DATABASE__DSN: .data/app.db
    APP_STORAGE__DRIVER: local
    APP_STORAGE__LOCAL__BASEPATH: .data/storage
    APP_FILES__TRANSFERS__STAGINGPATH: .data/transfers
    APP_FILES__CONNECTIONS__PUBLICORIGIN: http://127.0.0.1:${CLOUDDRIVE_UI_API_PORT:-8130}
  volumes:
    - ./.data/ui-production:/app/.data

services:
  migrate:
    <<: *backend
    profiles: [tools]
    command: [db, migrate, up]

  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - 127.0.0.1:${CLOUDDRIVE_UI_API_PORT:-8130}:8080
      - 127.0.0.1:${CLOUDDRIVE_UI_MANAGEMENT_PORT:-9130}:9090

  web:
    image: clouddrive-web:kira
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CLOUDDRIVE_BACKEND_URL: http://backend:8080
    ports:
      - 127.0.0.1:${CLOUDDRIVE_UI_WEB_PORT:-4194}:4173
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4173/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
