name: Visual review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 手动原生浏览器取证，先重复验证跨文档账号入口，再采集截图。
jobs:
  windows-lifecycle:
    name: Native Windows lifecycle evidence
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Repeat saved-share restart and terminal drain under race
        run: go test -race -p 1 ./internal/composition -run '^TestSavedSharesLifecyclePinCASAuthorizationAndRestart$' -count=20
      - name: Repeat watched configuration publication and locked-reader preservation
        run: go test -race -p 1 ./internal/kernel -run '^(TestWatchRecoversAfterRestartRequiredCandidateIsRestored|TestRecoveryPublishPreservesBothFilesWhenReaderKeepsDeleteLocked)$' -count=20
  review:
    name: Native visual evidence / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
      - name: Set up pinned pnpm
        shell: pwsh
        run: |
          $pnpmRoot = Join-Path $env:RUNNER_TEMP 'neocloud-pnpm'
          & npm install --prefix $pnpmRoot --no-package-lock --no-save pnpm@10.22.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $pnpmRoot 'node_modules/.bin') >> $env:GITHUB_PATH
      - name: Prepare native browser
        shell: pwsh
        run: |
          & pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) { & pnpm exec playwright install chromium }
          else { & pnpm exec playwright install --with-deps chromium }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify final backend registration landing repeatedly
        run: >-
          pnpm exec playwright test --project=backend-contract --reporter="list,github"
          authentication-backend.spec.ts --grep "Backend registration reports" --repeat-each=20
      - name: Verify lazy operation cancellation and route cleanup repeatedly
        run: >-
          pnpm exec playwright test --project=chromium --reporter="list,github"
          ui-ux-109.spec.ts confirm-pending-109.spec.ts
          --grep "Leaving during validation prevents|Pending export confirmation" --repeat-each=20
      - name: Verify settled mobile calendar and bulk confirmation accessibility repeatedly
        run: >-
          pnpm exec playwright test --project=chromium --reporter="list,github"
          management-completion.spec.ts --grep "Mobile management filters and bulk confirmation" --repeat-each=20
      - name: Collect visual evidence without updating goldens
        run: >-
          pnpm exec playwright test --reporter="list,github"
          fonts.spec.ts authentication.spec.ts data-display.spec.ts navigation.spec.ts
          overlays.spec.ts reference-resources.spec.ts surface-foundation.spec.ts visual.spec.ts
      - name: Preserve screenshots for individual review
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-review-${{ matrix.os }}-${{ github.sha }}
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/trace.zip
            frontend/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
