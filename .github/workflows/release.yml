name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build signed draft release
    if: github.repository == 'reina0721/neocloud'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Set up pnpm
        run: |
          npx --yes pnpm@10.22.0 --version
      - name: Install pinned release tools
        run: |
          tool_dir="$(node scripts/project-layout.mjs --field toolsRoot)"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install github.com/goreleaser/goreleaser/v2@v2.17.1
          GOBIN="${tool_dir}" go install github.com/anchore/syft/cmd/syft@v1.50.0
          GOBIN="${tool_dir}" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          GOBIN="${tool_dir}" go install github.com/google/go-licenses/v2@v2.0.1
          echo "${tool_dir}" >> "${GITHUB_PATH}"
          echo "GORELEASER_DIST=$(node scripts/project-layout.mjs --field releaseRoot)" >> "${GITHUB_ENV}"
      - name: Verify exact source and completed main release gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          bash scripts/wait-release-gates.sh
          node --test scripts/install.test.mjs scripts/verify-release.test.mjs scripts/release-config.test.mjs scripts/verify-elf-platform.test.mjs scripts/docker-image-config-id.test.mjs
          test -z "$(git status --porcelain)"
      - name: Build draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-config.mjs --output "${RUNNER_TEMP}/goreleaser.yaml"
          goreleaser release --clean --skip=sign --config "${RUNNER_TEMP}/goreleaser.yaml"
      - name: Verify archive license trees
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -tzf "${GORELEASER_DIST}/clouddrive_${version}_linux_amd64.tar.gz" > "${RUNNER_TEMP}/linux-files.txt"
          unzip -Z1 "${GORELEASER_DIST}/clouddrive_${version}_windows_amd64.zip" > "${RUNNER_TEMP}/windows-files.txt"
          for list in linux-files windows-files; do
            for file in README.md LICENSE NOTICE SOURCES.json locales/messages.zh-CN.yaml internal/module/todo/binding/i18n/locales/messages.zh-CN.yaml third-party/GO-LICENSE third-party/github.com/spf13/cobra/LICENSE.txt; do
              grep -Fx "${file}" "${RUNNER_TEMP}/${list}.txt"
            done
          done
          node scripts/test-go-archive.mjs --archive "${GORELEASER_DIST}/clouddrive_${version}_linux_amd64.tar.gz"
      - name: Sign and verify checksum bundle
        run: |
          checksum="${GORELEASER_DIST}/checksums.txt"
          bundle="${GORELEASER_DIST}/checksums.txt.sigstore.json"
          cosign sign-blob --yes --bundle "${bundle}" "${checksum}"
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${checksum}"
      - name: Attach verification bundle to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${GORELEASER_DIST}/checksums.txt.sigstore.json" --clobber

  docker-bundles:
    name: Docker Release / ${{ matrix.arch }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Build paired offline images
        run: bash scripts/build-docker-release.sh --version "${GITHUB_REF_NAME}" --arch "${{ matrix.arch }}" --out dist/docker
      - name: Build host maintenance command
        run: |
          binary="dist/docker/clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -buildvcs=false -ldflags="-s -w" -o "${binary}" ./cmd/clouddrive-maintenance
          node scripts/verify-elf-platform.mjs "${binary}" "${{ matrix.arch }}"
      - name: Exercise installation and persistence on native architecture
        run: node scripts/test-docker-release.mjs --release-dir dist/docker --version "${GITHUB_REF_NAME}"
      - name: Exercise default HTTP installation on a non-loopback IP
        run: node scripts/test-docker-release.mjs --release-dir dist/docker --version "${GITHUB_REF_NAME}" --network-host "$(hostname -I | awk '{print $1}')"
      - name: Produce image SBOMs
        run: |
          GOBIN="${RUNNER_TEMP}/release-tools" go install github.com/anchore/syft/cmd/syft@v1.50.0
          for service in api web; do
            "${RUNNER_TEMP}/release-tools/syft" "docker:clouddrive-${service}:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
              --output "spdx-json=dist/docker/clouddrive-${service}_${GITHUB_REF_NAME}_${{ matrix.arch }}.spdx.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-${{ matrix.arch }}
          path: dist/docker/
          compression-level: 0

  attach-docker:
    name: Attach and sign complete draft asset set
    needs: [release, docker-bundles]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: docker-*
          merge-multiple: true
          path: dist/docker
      - name: Merge checksums and verify images' archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/complete
          gh release download "${GITHUB_REF_NAME}" --pattern checksums.txt --pattern '*.spdx.json' --dir dist/complete
          (cd dist/complete && sha256sum -- *.spdx.json >> checksums.txt)
          cd dist/docker
          sha256sum --check "checksums-amd64.txt"
          sha256sum --check "checksums-arm64.txt"
          sha256sum -- clouddrive_*_docker.tar.gz clouddrive-maintenance_* install.sh version.txt *.spdx.json >> ../complete/checksums.txt
          LC_ALL=C sort -u -k2 ../complete/checksums.txt -o ../complete/checksums.txt
      - name: Sign final checksum set
        run: |
          GOBIN="${RUNNER_TEMP}/release-tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          cosign="${RUNNER_TEMP}/release-tools/cosign"
          "${cosign}" sign-blob --yes --bundle dist/complete/checksums.txt.sigstore.json dist/complete/checksums.txt
          "${cosign}" verify-blob --bundle dist/complete/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/complete/checksums.txt
      - name: Upload complete assets to draft only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = true
          gh release upload "${GITHUB_REF_NAME}" dist/docker/clouddrive_*_docker.tar.gz dist/docker/install.sh \
            dist/docker/version.txt dist/docker/*.spdx.json dist/docker/clouddrive-maintenance_* dist/complete/checksums.txt dist/complete/checksums.txt.sigstore.json --clobber

  maintenance-acceptance:
    name: Native browser maintenance / ${{ matrix.arch }}
    needs: attach-docker
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd5d6820020
        with:
          node-version: 24.11.1
      - name: Download the signed candidate and previous stable release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          old="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "$old" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$old" != "$GITHUB_REF_NAME"
          gh release download "$old" --dir "${RUNNER_TEMP}/baseline" \
            --pattern install.sh --pattern checksums.txt --pattern "clouddrive_${old}_linux_${ARCH}_docker.tar.gz"
          gh release download "$GITHUB_REF_NAME" --dir "${RUNNER_TEMP}/candidate" \
            --pattern install.sh --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern "clouddrive_${GITHUB_REF_NAME}_linux_${ARCH}_docker.tar.gz" \
            --pattern "clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${ARCH}"
          echo "BASELINE_VERSION=$old" >> "${GITHUB_ENV}"
      - name: Prepare browser and release verifier
        run: |
          GOBIN="${RUNNER_TEMP}/tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/maintenance-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "${GITHUB_ENV}"
          npx --yes pnpm@10.22.0 --dir frontend install --frozen-lockfile
          npx --yes pnpm@10.22.0 --dir frontend exec playwright install --with-deps chromium
      - name: Exercise port handover, browser maintenance and complete restore
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd "${RUNNER_TEMP}/candidate"
          "${RUNNER_TEMP}/tools/cosign" verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          tool="clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${ARCH}"
          awk -v asset="$tool" '$2 == asset {print}' checksums.txt | sha256sum -c -
          chmod 700 "$tool"
          cd "${GITHUB_WORKSPACE}"
          sudo env CLOUDDRIVE_COSIGN="${RUNNER_TEMP}/tools/cosign" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            "$(command -v node)" scripts/test-docker-maintenance.mjs \
            --candidate "${RUNNER_TEMP}/candidate" --version "$GITHUB_REF_NAME" \
            --baseline "${RUNNER_TEMP}/baseline" --baseline-version "$BASELINE_VERSION"
          sudo env CLOUDDRIVE_COSIGN="${RUNNER_TEMP}/tools/cosign" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            "$(command -v node)" scripts/test-docker-maintenance.mjs \
            --candidate "${RUNNER_TEMP}/candidate" --version "$GITHUB_REF_NAME"

  publish:
    name: Verify and publish stable release
    needs: maintenance-acceptance
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify immutable annotated tag and independent gates
        run: |
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          bash scripts/wait-release-gates.sh
      - name: Download and verify complete signed asset set
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/release-pages.json"
          node scripts/verify-release.mjs draft "${RUNNER_TEMP}/release-pages.json" "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release.json"
          gh release download "${GITHUB_REF_NAME}" --dir "${RUNNER_TEMP}/release-assets"
          node scripts/verify-release.mjs assets "${RUNNER_TEMP}/release.json" "${RUNNER_TEMP}/release-assets" "${GITHUB_SHA}"
          GOBIN="${RUNNER_TEMP}/release-tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          "${RUNNER_TEMP}/release-tools/cosign" verify-blob \
            --bundle "${RUNNER_TEMP}/release-assets/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RUNNER_TEMP}/release-assets/checksums.txt"
      - name: Publish verified release as latest stable
        run: |
          node scripts/test-docker-release.mjs --release-dir "${RUNNER_TEMP}/release-assets" --version "${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false --latest
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "${GITHUB_REF_NAME}"
          echo "正式版：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" >> "${GITHUB_STEP_SUMMARY}"
