name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build signed draft release
    if: github.repository == 'reina0721/neocloud'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Set up pnpm
        run: |
          npx --yes pnpm@10.22.0 --version
      - name: Install pinned release tools
        run: |
          tool_dir="$(node scripts/project-layout.mjs --field toolsRoot)"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install github.com/goreleaser/goreleaser/v2@v2.17.1
          GOBIN="${tool_dir}" go install github.com/anchore/syft/cmd/syft@v1.50.0
          GOBIN="${tool_dir}" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          GOBIN="${tool_dir}" go install github.com/google/go-licenses/v2@v2.0.1
          echo "${tool_dir}" >> "${GITHUB_PATH}"
          echo "GORELEASER_DIST=$(node scripts/project-layout.mjs --field releaseRoot)" >> "${GITHUB_ENV}"
      - name: Verify exact source and completed main release gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          bash scripts/wait-release-gates.sh
          node --test scripts/install.test.mjs scripts/verify-release.test.mjs scripts/release-config.test.mjs scripts/verify-elf-platform.test.mjs scripts/docker-image-config-id.test.mjs
          test -z "$(git status --porcelain)"
      - name: Build draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            [[ "$published" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor "${published}^{commit}" "$GITHUB_SHA"
            export GORELEASER_PREVIOUS_TAG="$published"
          fi
          node scripts/release-config.mjs --output "${RUNNER_TEMP}/goreleaser.yaml"
          goreleaser release --clean --skip=sign --config "${RUNNER_TEMP}/goreleaser.yaml"
      - name: Verify archive license trees
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -tzf "${GORELEASER_DIST}/clouddrive_${version}_linux_amd64.tar.gz" > "${RUNNER_TEMP}/linux-files.txt"
          unzip -Z1 "${GORELEASER_DIST}/clouddrive_${version}_windows_amd64.zip" > "${RUNNER_TEMP}/windows-files.txt"
          for list in linux-files windows-files; do
            for file in README.md LICENSE NOTICE SOURCES.json locales/messages.zh-CN.yaml internal/module/todo/binding/i18n/locales/messages.zh-CN.yaml third-party/GO-LICENSE third-party/github.com/spf13/cobra/LICENSE.txt; do
              grep -Fx "${file}" "${RUNNER_TEMP}/${list}.txt"
            done
          done
          node scripts/test-go-archive.mjs --archive "${GORELEASER_DIST}/clouddrive_${version}_linux_amd64.tar.gz"
      - name: Sign and verify checksum bundle
        run: |
          checksum="${GORELEASER_DIST}/checksums.txt"
          bundle="${GORELEASER_DIST}/checksums.txt.sigstore.json"
          cosign sign-blob --yes --new-bundle-format --bundle "${bundle}" "${checksum}"
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${checksum}"
      - name: Attach verification bundle to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${GORELEASER_DIST}/checksums.txt.sigstore.json" --clobber

  docker-bundles:
    name: Docker Release / ${{ matrix.arch }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Build paired offline images
        run: bash scripts/build-docker-release.sh --version "${GITHUB_REF_NAME}" --arch "${{ matrix.arch }}" --out dist/docker
      - name: Build host maintenance command
        run: |
          binary="dist/docker/clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -buildvcs=false -ldflags="-s -w" -o "${binary}" ./cmd/clouddrive-maintenance
          node scripts/verify-elf-platform.mjs "${binary}" "${{ matrix.arch }}"
      - name: Produce image SBOMs
        run: |
          GOBIN="${RUNNER_TEMP}/release-tools" go install github.com/anchore/syft/cmd/syft@v1.50.0
          for service in api web; do
            "${RUNNER_TEMP}/release-tools/syft" "docker:clouddrive-${service}:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
              --output "spdx-json=dist/docker/clouddrive-${service}_${GITHUB_REF_NAME}_${{ matrix.arch }}.spdx.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-${{ matrix.arch }}
          path: dist/docker/
          compression-level: 0

  managed-static-web:
    name: Build static Web for native packages
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: ${{ !contains(github.ref_name, '-') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          node-version: 24.11.1
      - name: Build one static Web release tree and its third-party notices
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          npm install --global pnpm@10.22.0
          pnpm --dir frontend install --frozen-lockfile
          node scripts/build-static-web.mjs --output "$RUNNER_TEMP/managed-static/web" --commit "$GITHUB_SHA"
          node --input-type=module - "$RUNNER_TEMP/managed-static/licenses" <<'NODE'
          import { mkdir } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { bundleLicenses } from './frontend/tooling/bundle-licenses.mjs';
          const output = process.argv[2];
          await mkdir(output, { recursive: true });
          await bundleLicenses(resolve('frontend'), output);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: managed-static-web
          path: ${{ runner.temp }}/managed-static/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  managed-go-bundles:
    name: Managed Go release / ${{ matrix.os }}-${{ matrix.arch }}
    needs: [release, managed-static-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: managed-static-web
          path: ${{ runner.temp }}/managed-static
      - name: Package both managed native profiles and generate SPDX SBOMs
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -z "$(git status --porcelain)"
          export GOBIN="${RUNNER_TEMP}/managed-tools"
          go install github.com/google/go-licenses/v2@v2.0.1
          go install github.com/anchore/syft/cmd/syft@v1.50.0
          export PATH="$GOBIN:$PATH"
          baseline=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          [[ "$baseline" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          baseline_assets=$(gh release view "$baseline" --json assets --jq '.assets[].name')
          source_args=()
          if grep -q '_managed-go\.zip$' <<< "$baseline_assets"; then
            grep -Fxq "clouddrive_${baseline}_${TARGET_OS}_${TARGET_ARCH}_managed-go.zip" <<< "$baseline_assets"
            baseline_commit=$(git rev-parse "${baseline}^{commit}")
            source_args=(--base-version "$baseline" --base-commit "$baseline_commit")
          fi
          node scripts/build-managed-go-release.mjs --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --os "$TARGET_OS" --arch "$TARGET_ARCH" --out dist/managed-go "${source_args[@]}"
          node scripts/build-managed-go-release.mjs --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --os "$TARGET_OS" --arch "$TARGET_ARCH" --out dist/managed-go "${source_args[@]}" \
            --web-dir "$RUNNER_TEMP/managed-static/web" --web-licenses-dir "$RUNNER_TEMP/managed-static/licenses"
          for profile in managed-go managed-full; do
            archive="dist/managed-go/clouddrive_${GITHUB_REF_NAME}_${TARGET_OS}_${TARGET_ARCH}_${profile}.zip"
            syft "file:$archive" --output "spdx-json=$archive.spdx.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: managed-go-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/managed-go/
          if-no-files-found: error
          compression-level: 0

  attach-docker:
    name: Attach and sign complete draft asset set
    needs: [release, docker-bundles, managed-go-bundles]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: docker-*
          merge-multiple: true
          path: dist/docker
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          pattern: managed-go-*
          merge-multiple: true
          path: dist/managed-go
      - name: Merge checksums and verify images' archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/complete
          gh release download "${GITHUB_REF_NAME}" --pattern checksums.txt --pattern '*.spdx.json' --dir dist/complete
          (cd dist/complete && sha256sum -- *.spdx.json >> checksums.txt)
          cd dist/docker
          sha256sum --check "checksums-amd64.txt"
          sha256sum --check "checksums-arm64.txt"
          sha256sum -- clouddrive_*_docker.tar.gz clouddrive-maintenance_* install.sh version.txt *.spdx.json >> ../complete/checksums.txt
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            (cd ../managed-go && sha256sum -- *_managed-go.zip *_managed-full.zip *_managed-go.zip.spdx.json *_managed-full.zip.spdx.json) >> ../complete/checksums.txt
          fi
          LC_ALL=C sort -u -k2 ../complete/checksums.txt -o ../complete/checksums.txt
      - name: Sign final checksum set
        run: |
          GOBIN="${RUNNER_TEMP}/release-tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          cosign="${RUNNER_TEMP}/release-tools/cosign"
          "${cosign}" sign-blob --yes --new-bundle-format --bundle dist/complete/checksums.txt.sigstore.json dist/complete/checksums.txt
          "${cosign}" verify-blob --bundle dist/complete/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/complete/checksums.txt
      - name: Upload complete assets to draft only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = true
          gh release upload "${GITHUB_REF_NAME}" dist/docker/clouddrive_*_docker.tar.gz dist/docker/install.sh \
            dist/docker/version.txt dist/docker/*.spdx.json dist/docker/clouddrive-maintenance_* dist/complete/checksums.txt dist/complete/checksums.txt.sigstore.json --clobber
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            gh release upload "${GITHUB_REF_NAME}" dist/managed-go/*_managed-go.zip dist/managed-go/*_managed-full.zip \
              dist/managed-go/*_managed-go.zip.spdx.json dist/managed-go/*_managed-full.zip.spdx.json --clobber
          fi

  docker-acceptance:
    name: Signed Docker and air-gap acceptance / ${{ matrix.arch }}
    needs: attach-docker
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
      - name: Load the signed native package and independent TUF trust
        env:
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir "${RUNNER_TEMP}/candidate" \
            --pattern install.sh --pattern version.txt --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern "clouddrive_${GITHUB_REF_NAME}_linux_${ARCH}_docker.tar.gz" \
            --pattern "clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${ARCH}"
          GOBIN="${RUNNER_TEMP}/release-tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          export CLOUDDRIVE_COSIGN="${RUNNER_TEMP}/release-tools/cosign"
          export CLOUDDRIVE_OFFLINE_TRUST_DIR="${RUNNER_TEMP}/offline-trust"
          bash scripts/prepare-offline-trust.sh "$CLOUDDRIVE_OFFLINE_TRUST_DIR" --legacy
          printf 'CLOUDDRIVE_COSIGN=%s\nCLOUDDRIVE_OFFLINE_TRUST_DIR=%s\n' \
            "$CLOUDDRIVE_COSIGN" "$CLOUDDRIVE_OFFLINE_TRUST_DIR" >> "$GITHUB_ENV"
      - name: Exercise the genuine air-gap install and legacy bundle verification
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          candidate="${RUNNER_TEMP}/candidate"
          bash scripts/test-offline-release.sh "$candidate" "$CLOUDDRIVE_OFFLINE_TRUST_DIR" "$GITHUB_REF_NAME" "$ARCH"
          legacy=v0.2.2
          gh release download "$legacy" --dir "${RUNNER_TEMP}/legacy" \
            --pattern install.sh --pattern version.txt --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern "clouddrive_${legacy}_linux_${ARCH}_docker.tar.gz"
          tool="$candidate/clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${ARCH}"
          chmod 700 "$tool"
          sudo unshare --net -- "$tool" verify-release --cosign "$CLOUDDRIVE_COSIGN" \
            --release-dir "${RUNNER_TEMP}/legacy" --trust-dir "$CLOUDDRIVE_OFFLINE_TRUST_DIR" \
            --version "$legacy" --arch "$ARCH"
          bash scripts/test-offline-transition.sh "${RUNNER_TEMP}/legacy" "$candidate" "$CLOUDDRIVE_OFFLINE_TRUST_DIR"
      - name: Exercise installation and persistence on native architecture
        run: node scripts/test-docker-release.mjs --release-dir "${RUNNER_TEMP}/candidate" --version "$GITHUB_REF_NAME"
      - name: Exercise default HTTP installation on a non-loopback IP
        run: node scripts/test-docker-release.mjs --release-dir "${RUNNER_TEMP}/candidate" --version "$GITHUB_REF_NAME" --network-host "$(hostname -I | awk '{print $1}')"

  maintenance-acceptance:
    name: Native browser maintenance / ${{ matrix.arch }}
    needs: docker-acceptance
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
      - name: Download the signed candidate and previous stable release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          old="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "$old" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$old" != "$GITHUB_REF_NAME"
          gh release download "$old" --dir "${RUNNER_TEMP}/baseline" \
            --pattern install.sh --pattern version.txt --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern "clouddrive_${old}_linux_${ARCH}_docker.tar.gz"
          gh release download "$GITHUB_REF_NAME" --dir "${RUNNER_TEMP}/candidate" \
            --pattern install.sh --pattern version.txt --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern "clouddrive_${GITHUB_REF_NAME}_linux_${ARCH}_docker.tar.gz" \
            --pattern "clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${ARCH}"
          echo "BASELINE_VERSION=$old" >> "${GITHUB_ENV}"
      - name: Prepare browser and release verifier
        run: |
          GOBIN="${RUNNER_TEMP}/tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          export CLOUDDRIVE_COSIGN="${RUNNER_TEMP}/tools/cosign"
          export CLOUDDRIVE_OFFLINE_TRUST_DIR="${RUNNER_TEMP}/offline-trust"
          bash scripts/prepare-offline-trust.sh "$CLOUDDRIVE_OFFLINE_TRUST_DIR" --legacy
          echo "CLOUDDRIVE_OFFLINE_TRUST_DIR=$CLOUDDRIVE_OFFLINE_TRUST_DIR" >> "$GITHUB_ENV"
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/maintenance-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "${GITHUB_ENV}"
          npx --yes pnpm@10.22.0 --dir frontend install --frozen-lockfile
          npx --yes pnpm@10.22.0 --dir frontend exec playwright install --with-deps chromium
      - name: Exercise port handover, browser maintenance and complete restore
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd "${RUNNER_TEMP}/candidate"
          "${RUNNER_TEMP}/tools/cosign" verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          tool="clouddrive-maintenance_${GITHUB_REF_NAME}_linux_${ARCH}"
          awk -v asset="$tool" '$2 == asset {print}' checksums.txt | sha256sum -c -
          chmod 700 "$tool"
          cd "${GITHUB_WORKSPACE}"
          sudo env CLOUDDRIVE_COSIGN="${RUNNER_TEMP}/tools/cosign" CLOUDDRIVE_OFFLINE_TRUST_DIR="$CLOUDDRIVE_OFFLINE_TRUST_DIR" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            "$(command -v node)" scripts/test-docker-maintenance.mjs \
            --candidate "${RUNNER_TEMP}/candidate" --version "$GITHUB_REF_NAME" \
            --baseline "${RUNNER_TEMP}/baseline" --baseline-version "$BASELINE_VERSION"
          sudo env CLOUDDRIVE_COSIGN="${RUNNER_TEMP}/tools/cosign" CLOUDDRIVE_OFFLINE_TRUST_DIR="$CLOUDDRIVE_OFFLINE_TRUST_DIR" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            "$(command -v node)" scripts/test-docker-maintenance.mjs \
            --candidate "${RUNNER_TEMP}/candidate" --version "$GITHUB_REF_NAME"

  managed-go-acceptance-linux:
    name: Native Go process handoff / linux-${{ matrix.arch }}
    needs: attach-docker
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: scaffold_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scaffold_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: scaffold_test
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Exercise native processes and online migration on all supported databases
        env:
          MANAGED_PG_CONTAINER: ${{ job.services.postgres.id }}
          MANAGED_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          CLOUDDRIVE_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/scaffold_test?sslmode=disable
          CLOUDDRIVE_TEST_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/scaffold_test?parseTime=true
          TEST_MIGRATION_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/scaffold_test?sslmode=disable
          TEST_MIGRATION_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/scaffold_test?parseTime=true
        shell: bash
        run: |
          # 两个架构均使用与数据库服务同版本的备份客户端，避免宿主镜像中旧版工具。
          docker exec "$MANAGED_PG_CONTAINER" pg_dump --version | grep -E '^pg_dump .* 18[.]'
          docker exec "$MANAGED_PG_CONTAINER" pg_restore --version | grep -E '^pg_restore .* 18[.]'
          docker exec "$MANAGED_MYSQL_CONTAINER" mysqldump --version | grep -E '^mysqldump .* 8[.]4[.]'
          clients="$(mktemp -d "$RUNNER_TEMP/managed-db-clients.XXXXXXXX")"
          cat > "$clients/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          output=
          args=()
          for arg in "$@"; do
            case "$arg" in
              --file=/*) output="${arg#--file=}" ;;
              *) args+=("$arg") ;;
            esac
          done
          [[ -n "$output" ]]
          exec docker exec -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \
            "$MANAGED_PG_CONTAINER" pg_dump "${args[@]}" > "$output"
          SH
          cat > "$clients/pg_restore" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ $# == 2 && "$1" == --list ]]
          exec docker exec -i "$MANAGED_PG_CONTAINER" pg_restore --list < "$2"
          SH
          cat > "$clients/mysqldump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          defaults=
          output=
          args=()
          for arg in "$@"; do
            case "$arg" in
              --defaults-file=/*) defaults="${arg#--defaults-file=}" ;;
              --result-file=/*) output="${arg#--result-file=}" ;;
              *) args+=("$arg") ;;
            esac
          done
          [[ -n "$defaults" && -n "$output" ]]
          # 通过标准输入传入凭据文件，在容器内为客户端建立私有临时文件。
          exec docker exec -i "$MANAGED_MYSQL_CONTAINER" sh -eu -c '
            umask 077
            config=$(mktemp)
            trap "rm -f \"$config\"" EXIT
            cat > "$config"
            mysqldump --defaults-file="$config" "$@"
          ' sh "${args[@]}" < "$defaults" > "$output"
          SH
          chmod 700 "$clients/pg_dump" "$clients/pg_restore" "$clients/mysqldump"
          PATH="$clients:$PATH" go test -count=1 -p=1 ./internal/nativeupgrade ./internal/deployment ./internal/module/migration

  managed-go-acceptance-windows:
    name: Native Go process handoff / windows-amd64
    needs: attach-docker
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Exercise native processes and SQLite on Windows
        run: go test -count=1 -p=1 ./internal/nativeupgrade ./internal/deployment ./internal/module/migration

  managed-full-acceptance:
    name: Signed native full draft / ${{ matrix.os }}-${{ matrix.arch }}
    needs: attach-docker
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Boot the signed full package on its target platform
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'native-full-draft'
          $tools = Join-Path $root 'tools'
          $release = Join-Path $root 'release'
          $trust = Join-Path $root 'trust'
          New-Item -ItemType Directory -Path $tools, $release, $trust | Out-Null
          $asset = "clouddrive_${env:GITHUB_REF_NAME}_${env:TARGET_OS}_${env:TARGET_ARCH}_managed-full.zip"
          gh release download $env:GITHUB_REF_NAME --dir $release --pattern $asset --pattern checksums.txt --pattern checksums.txt.sigstore.json
          $env:GOBIN = $tools
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          $env:TUF_ROOT = Join-Path $root 'tuf'
          Remove-Item Env:TUF_ROOT_JSON, Env:TUF_MIRROR -ErrorAction SilentlyContinue
          $cosign = Join-Path $tools ($IsWindows ? 'cosign.exe' : 'cosign')
          & $cosign initialize --mirror https://tuf-repo-cdn.sigstore.dev
          Copy-Item -LiteralPath (Join-Path $env:TUF_ROOT 'tuf-repo-cdn.sigstore.dev/targets/trusted_root.json') -Destination $trust
          $env:CLOUDDRIVE_TEST_NATIVE_RELEASE_DIR = $release
          $env:CLOUDDRIVE_TEST_NATIVE_TRUST_DIR = $trust
          $env:CLOUDDRIVE_TEST_NATIVE_TAG = $env:GITHUB_REF_NAME
          $env:CLOUDDRIVE_TEST_NATIVE_COMMIT = $env:GITHUB_SHA
          go test -count=1 -v ./internal/nativeupgrade -run '^TestSignedFullReleaseBoot$'

  publish:
    name: Verify and publish stable release
    needs: [maintenance-acceptance, managed-go-acceptance-linux, managed-go-acceptance-windows, managed-full-acceptance]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify immutable annotated tag and independent gates
        run: |
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          bash scripts/wait-release-gates.sh
      - name: Download and verify complete signed asset set
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/release-pages.json"
          node scripts/verify-release.mjs draft "${RUNNER_TEMP}/release-pages.json" "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release.json"
          gh release download "${GITHUB_REF_NAME}" --dir "${RUNNER_TEMP}/release-assets"
          node scripts/verify-release.mjs assets "${RUNNER_TEMP}/release.json" "${RUNNER_TEMP}/release-assets" "${GITHUB_SHA}"
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            for profile in managed-go managed-full; do
              archive="${RUNNER_TEMP}/release-assets/clouddrive_${GITHUB_REF_NAME}_${os}_${arch}_${profile}.zip"
              go run ./internal/tools/native-archive --profile "$profile" --verify-managed "$archive" \
                --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --os "$os" --arch "$arch"
            done
          done
          GOBIN="${RUNNER_TEMP}/release-tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          "${RUNNER_TEMP}/release-tools/cosign" verify-blob \
            --bundle "${RUNNER_TEMP}/release-assets/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RUNNER_TEMP}/release-assets/checksums.txt"
      - name: Publish verified release as latest stable
        run: |
          export CLOUDDRIVE_COSIGN="${RUNNER_TEMP}/release-tools/cosign"
          export CLOUDDRIVE_OFFLINE_TRUST_DIR="${RUNNER_TEMP}/offline-trust"
          bash scripts/prepare-offline-trust.sh "$CLOUDDRIVE_OFFLINE_TRUST_DIR"
          go run ./internal/tools/native-archive --stage-offline "${RUNNER_TEMP}/verified-native-draft" \
            --release-dir "${RUNNER_TEMP}/release-assets" --trust-dir "$CLOUDDRIVE_OFFLINE_TRUST_DIR" \
            --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
          node scripts/test-docker-release.mjs --release-dir "${RUNNER_TEMP}/release-assets" --version "${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false --latest
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "${GITHUB_REF_NAME}"
          for attempt in {1..6}; do
            if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 20 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh" \
              --output "${RUNNER_TEMP}/public-install.sh" &&
              cmp --silent "${RUNNER_TEMP}/release-assets/install.sh" "${RUNNER_TEMP}/public-install.sh"; then
              break
            fi
            sleep 5
          done
          cmp -- "${RUNNER_TEMP}/release-assets/install.sh" "${RUNNER_TEMP}/public-install.sh"
          for profile in managed-go managed-full; do
            native_verified=false
            for attempt in {1..6}; do
              # 每轮独立缓存，实际走宿主使用的 GitHub 下载、验签、解包和本地回读路径。
              if go run ./internal/tools/native-archive --profile "$profile" \
                --stage-online "${RUNNER_TEMP}/verified-native-${profile}-${attempt}" \
                --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"; then
                native_verified=true
                break
              fi
              sleep 5
            done
            test "$native_verified" = true
          done
          echo "正式版：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" >> "${GITHUB_STEP_SUMMARY}"
