name: Container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Distroless runtime smoke / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build image
        env:
          VERSION: ci-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          docker build --pull --platform "linux/${{ matrix.arch }}" \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT="${COMMIT}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg DIRTY=false \
            --tag neocloud:ci .
      - name: Verify runtime profile
        run: bash scripts/container-smoke.sh neocloud:ci
  web-smoke:
    name: Standalone web runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and verify relocatable runtime
        run: docker build --pull -f frontend/Dockerfile --tag neocloud-web:ci .
      - name: Verify nonroot runtime entry
        run: >-
          docker run --rm neocloud-web:ci node -e
          'if (process.getuid() === 0) throw new Error("runtime must be nonroot");
          const fs = require("node:fs");
          fs.accessSync("server.js");
          fs.accessSync("runtime/start-web.mjs");
          for (const file of ["LICENSE", "NOTICE", "SOURCES.json", "fonts/inter-OFL.txt", "fonts/noto-sans-sc-OFL.txt"])
            if (fs.statSync("/usr/share/licenses/neocloud/" + file).size === 0) throw new Error("empty license: " + file);
          const inventory = JSON.parse(fs.readFileSync("/usr/share/licenses/neocloud/third-party/node/inventory.json", "utf8"));
          if (!inventory.some(pkg => pkg.name === "next" && pkg.files.length)) throw new Error("missing dependency licenses");'
