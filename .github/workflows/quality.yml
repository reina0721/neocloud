name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VALIDATION_FULL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  repository:
    name: Repository configuration gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Install pinned workflow validator
        run: GOBIN="${RUNNER_TEMP}/repository-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows, documentation links and tracked artifacts
        run: |
          "${RUNNER_TEMP}/repository-tools/actionlint"
          go run ./internal/tools/docs-guard
          node scripts/verify-artifacts.mjs
      - name: Test repository and release controls
        if: github.event_name == 'workflow_dispatch'
        run: |
          go test ./internal/tools/docs-guard
          GOBIN="${RUNNER_TEMP}/repository-tools" go install github.com/goreleaser/goreleaser/v2@v2.17.1
          node scripts/release-config.mjs --output "${RUNNER_TEMP}/goreleaser.yaml"
          "${RUNNER_TEMP}/repository-tools/goreleaser" check --config "${RUNNER_TEMP}/goreleaser.yaml"
          node --test scripts/verify-changed.test.mjs scripts/verify-artifacts.test.mjs scripts/release-config.test.mjs scripts/release-go-source.test.mjs scripts/verify-release.test.mjs scripts/install.test.mjs scripts/verify-elf-platform.test.mjs scripts/docker-image-config-id.test.mjs

  changes:
    if: github.event_name == 'pull_request'
    name: Classify validation scope
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.scope.outputs.api }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - id: scope
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-validation.mjs classify

  windows:
    if: github.event_name == 'workflow_dispatch'
    name: Windows quality gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run quality gates
        shell: pwsh
        run: node scripts/ci-validation.mjs backend

  linux:
    if: github.event_name == 'workflow_dispatch'
    name: Linux quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run quality gates
        run: node scripts/ci-validation.mjs backend
      - name: Run bounded fuzz gate
        run: go test ./internal/kernel/config -run '^$' -fuzz '^FuzzJSONObject$' -fuzztime 15s

  webui-windows:
    if: github.event_name == 'workflow_dispatch'
    name: Windows frontend quality gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Set up pnpm
        shell: pwsh
        run: |
          $pnpmRoot = Join-Path $env:RUNNER_TEMP 'clouddrive-pnpm'
          & npm install --prefix $pnpmRoot --no-package-lock --no-save pnpm@10.22.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $pnpmRoot 'node_modules/.bin') >> $env:GITHUB_PATH
      - name: Run frontend quality gates
        shell: pwsh
        run: node scripts/ci-validation.mjs frontend
      - name: Preserve browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webui-failure-windows-${{ github.sha }}
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/trace.zip
            frontend/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  webui-linux:
    if: github.event_name == 'workflow_dispatch'
    name: Linux frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Set up pnpm
        shell: pwsh
        run: |
          $pnpmRoot = Join-Path $env:RUNNER_TEMP 'clouddrive-pnpm'
          & npm install --prefix $pnpmRoot --no-package-lock --no-save pnpm@10.22.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $pnpmRoot 'node_modules/.bin') >> $env:GITHUB_PATH
      - name: Run frontend quality gates
        run: node scripts/ci-validation.mjs frontend
      - name: Preserve browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webui-failure-linux-${{ github.sha }}
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/trace.zip
            frontend/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  docs-windows:
    if: github.event_name == 'workflow_dispatch'
    name: Windows documentation quality gates
    runs-on: windows-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run documentation quality gates
        shell: pwsh
        run: node scripts/ci-validation.mjs docs

  docs-linux:
    if: github.event_name == 'workflow_dispatch'
    name: Linux documentation quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run documentation quality gates
        run: node scripts/ci-validation.mjs docs

  openapi-breaking:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name == 'pull_request'
    name: OpenAPI breaking gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compare OpenAPI authority with merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p tmp/openapi
          git show "${BASE_SHA}:api/openapi.yaml" > tmp/openapi/base.yaml
          go tool oasdiff breaking tmp/openapi/base.yaml api/openapi.yaml --fail-on ERR

  security:
    if: github.event_name == 'workflow_dispatch'
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned scanners
        run: |
          tool_dir="$(node scripts/project-layout.mjs --field toolsRoot)"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOBIN="${tool_dir}" go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          GOBIN="${tool_dir}" go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Reachable vulnerability scan
        run: govulncheck ./...
      - name: Go security scan
        run: gosec -exclude-generated ./cmd/... ./internal/... ./pkg/...
      - name: Secret scan
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  summary:
    name: Validation summary
    if: always()
    needs:
      [
        changes,
        repository,
        windows,
        linux,
        webui-windows,
        webui-linux,
        docs-windows,
        docs-linux,
        openapi-breaking,
        security,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require success or intentional skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>!["success","skipped"].includes(job.result))) process.exit(1)'
