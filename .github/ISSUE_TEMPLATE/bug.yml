name: 缺陷报告
description: 报告可复现的功能或部署缺陷
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有问题。潜在漏洞请通过仓库 Security 页私密报告；日志和截图不要包含凭据或私人数据。
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      description: Release tag；源码部署请填写完整 commit。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、CPU 架构、浏览器版本、Docker 或源码部署方式，以及相关工具版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小步骤和必要的脱敏配置。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
      description: 去除密码、Cookie、Token、签名链接、完整 DSN 和用户文件；不要上传数据库。
