name: 功能建议
description: 用真实场景说明希望改进的能力
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 场景与问题
      description: 谁在什么场景遇到了什么困难？请先查阅当前功能与限制。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述希望完成的任务和可观察的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案与限制
